[project]
name = "swarini-indic-tts"
version = "0.1.0"
description = "A configurable pipeline and runtime for compact distilled Indic TTS students"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "onnxruntime>=1.17",
    "misaki==0.9.4",
    "phonemizer-fork==3.3.2",
    "espeakng-loader==0.2.4",
]

[project.optional-dependencies]
indic-g2p = [
    "indic-g2p @ git+https://github.com/Bindkushal/indic-g2p@6bc9ca45fb06955bb19057344ac6a4e400ed4c95",
]

[project.scripts]
swarini = "swarini.__main__:main"

[project.urls]
"Prior work" = "https://github.com/sahilmahendrakar/paradee"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarini"]
